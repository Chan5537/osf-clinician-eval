# Preview deploy for a review branch, run BY HAND only.
#
# The main deploy (deploy.yml) fires on every push to main and owns the canonical
# GitHub Pages site. This one exists so a work-in-progress batch can be looked at
# without replacing what main is serving: it builds whichever branch you pick and
# uploads the result as a downloadable artifact, so nothing published changes.
#
# Use: Actions -> "Preview build (manual)" -> Run workflow -> pick the branch.
# The reviewer downloads the artifact, unzips, and opens it with any static server
# (`npx serve .`), or you attach it in Slack.
name: Preview build (manual)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch to build
        required: true
        default: v61-preview

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # relative base: the artifact opens from any directory, not just /osf-clinician-eval/
          VITE_BASE: ./
        run: npm run build

      - name: Upload preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ inputs.ref }}
          path: dist
